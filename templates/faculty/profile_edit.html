{% extends "layout_app.html" %}
{% block title %}Edit Profile{% endblock %}
{% block page_title %}Edit Profile{% endblock %}
{% block content %}

<div class="panel" style="max-width:720px;">
  <div class="panel-head">
    <h3>Edit Profile</h3>
    <a href="{{ url_for('faculty.profile') }}" class="btn btn-outline btn-sm">Cancel</a>
  </div>

  <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

    <h4 style="margin: 0 0 16px; color:var(--navy-900);"><i class="fa-solid fa-user"></i> Personal Information</h4>
    <div class="form-grid">
      <div class="form-field">
        <label>Full Name</label>
        <input type="text" name="full_name" value="{{ user.full_name }}" required>
      </div>
      <div class="form-field">
        <label>Date of Birth</label>
        <input type="date" name="date_of_birth" value="{{ faculty.date_of_birth.strftime('%Y-%m-%d') if faculty.date_of_birth else '' }}">
      </div>
      <div class="form-field">
        <label>Gender</label>
        <select name="gender">
          <option value="">Select</option>
          <option value="Male" {{ 'selected' if faculty.gender == 'Male' }}>Male</option>
          <option value="Female" {{ 'selected' if faculty.gender == 'Female' }}>Female</option>
          <option value="Other" {{ 'selected' if faculty.gender == 'Other' }}>Other</option>
        </select>
      </div>
      <div class="form-field">
        <label>Phone</label>
        <input type="tel" name="phone" value="{{ user.phone or '' }}">
      </div>
      <div class="form-field">
        <label>Email</label>
        <input type="email" name="email" value="{{ user.email }}" required>
      </div>
      <div class="form-field">
        <label>Emergency Contact</label>
        <input type="tel" name="emergency_contact" value="{{ faculty.emergency_contact or '' }}">
      </div>
    </div>

    <h4 style="margin: 24px 0 16px; color:var(--navy-900);"><i class="fa-solid fa-location-dot"></i> Address</h4>
    <div class="form-grid">
      <div class="form-field" style="grid-column: 1 / -1;">
        <label>Address</label>
        <input type="text" name="address" value="{{ faculty.address or '' }}">
      </div>
      <div class="form-field">
        <label>City</label>
        <input type="text" name="city" value="{{ faculty.city or '' }}">
      </div>
      <div class="form-field">
        <label>State</label>
        <input type="text" name="state" value="{{ faculty.state or '' }}">
      </div>
    </div>

    <h4 style="margin: 24px 0 16px; color:var(--navy-900);"><i class="fa-solid fa-briefcase"></i> Professional Information</h4>
    <div class="form-grid">
      <div class="form-field">
        <label>Qualification</label>
        <input type="text" name="qualification" value="{{ faculty.qualification or '' }}">
      </div>
      <div class="form-field">
        <label>Specialization</label>
        <input type="text" name="specialization" value="{{ faculty.specialization or '' }}">
      </div>
      <div class="form-field">
        <label>Experience (Years)</label>
        <input type="number" name="experience_years" value="{{ faculty.experience_years }}" min="0">
      </div>
    </div>

    <div style="display:flex; gap:12px; margin-top:24px;">
      <button type="submit" class="btn btn-blue"><i class="fa-solid fa-save"></i> Save Changes</button>
      <a href="{{ url_for('faculty.profile') }}" class="btn btn-outline">Cancel</a>
      <button type="reset" class="btn btn-outline"><i class="fa-solid fa-rotate-left"></i> Reset</button>
    </div>
  </form>
</div>

{% endblock %}
