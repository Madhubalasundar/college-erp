{% extends "layout_app.html" %}
{% block title %}Create Placement{% endblock %}
{% block page_title %}Create Placement{% endblock %}
{% block content %}

<div class="panel" style="max-width:640px;">
  <div class="panel-head"><h3>New Placement</h3></div>
  <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <div class="form-grid">
      <div class="form-field">
        <label>Company Name</label>
        <input type="text" name="company_name" required>
      </div>
      <div class="form-field">
        <label>Role</label>
        <input type="text" name="role" required>
      </div>
    </div>
    <div class="form-field">
      <label>Description</label>
      <textarea name="description" rows="3"></textarea>
    </div>
    <div class="form-field">
      <label>Eligibility Criteria</label>
      <textarea name="eligibility_criteria" rows="2"></textarea>
    </div>
    <div class="form-grid">
      <div class="form-field">
        <label>Package (CTC)</label>
        <input type="text" name="package_ctc" placeholder="e.g. 6 LPA">
      </div>
      <div class="form-field">
        <label>Application Deadline</label>
        <input type="date" name="application_deadline" required>
      </div>
      <div class="form-field">
        <label>Interview Date</label>
        <input type="date" name="interview_date">
      </div>
      <div class="form-field">
        <label>Venue</label>
        <input type="text" name="venue">
      </div>
    </div>
    <button type="submit" class="btn btn-blue"><i class="fa-solid fa-plus"></i> Create Placement</button>
  </form>
</div>

{% endblock %}
